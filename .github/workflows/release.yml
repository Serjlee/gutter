name: Release

# Pushing a tag like v0.1.0 builds the macOS and Linux apps and publishes
# them as a GitHub Release. Running the workflow manually only builds and
# uploads the artifacts (as dev builds).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
      label: ${{ steps.v.outputs.label }}
      build_args: ${{ steps.v.outputs.build_args }}
    steps:
      - id: v
        run: |
          commit="${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            label="$version"
          else
            version=""  # manual runs are dev builds: commit only
            label="dev-$commit"
          fi
          # Embedded in the Dart code (home tab) and, for releases, in the
          # bundle metadata (macOS About panel, Finder).
          build_args="--dart-define=GUTTER_VERSION=$version --dart-define=GUTTER_COMMIT=$commit"
          if [[ -n "$version" ]]; then
            build_args="$build_args --build-name=$version --build-number=$GITHUB_RUN_NUMBER"
          fi
          {
            echo "commit=$commit"
            echo "version=$version"
            echo "label=$label"
            echo "build_args=$build_args"
          } >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Build
        env:
          BUILD_ARGS: ${{ needs.version.outputs.build_args }}
        run: |
          # shellcheck disable=SC2086 # BUILD_ARGS is a list of flags
          flutter build macos --release $BUILD_ARGS

      - name: Check the embedded version
        env:
          GUTTER_VERSION: ${{ needs.version.outputs.version }}
          GUTTER_COMMIT: ${{ needs.version.outputs.commit }}
        run: tool/check_version.sh build/macos/Build/Products/Release/Gutter.app/Contents/Frameworks/App.framework/App "$GUTTER_VERSION" "$GUTTER_COMMIT"

      - name: Sign (ad-hoc) and verify
        working-directory: build/macos/Build/Products/Release
        run: |
          codesign --force --deep --sign - Gutter.app
          codesign --verify --deep --strict --verbose=2 Gutter.app
          lipo -archs Gutter.app/Contents/MacOS/Gutter

      - name: Package
        run: |
          ditto -c -k --keepParent build/macos/Build/Products/Release/Gutter.app \
            "Gutter-macos-${{ needs.version.outputs.label }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Gutter-macos-*.zip

  linux:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev

      - name: Build
        env:
          BUILD_ARGS: ${{ needs.version.outputs.build_args }}
        run: |
          # shellcheck disable=SC2086 # BUILD_ARGS is a list of flags
          flutter build linux --release $BUILD_ARGS

      - name: Check the embedded version
        env:
          GUTTER_VERSION: ${{ needs.version.outputs.version }}
          GUTTER_COMMIT: ${{ needs.version.outputs.commit }}
        run: tool/check_version.sh build/linux/x64/release/bundle/lib/libapp.so "$GUTTER_VERSION" "$GUTTER_COMMIT"

      - name: Package
        run: |
          name="gutter-linux-x64-${{ needs.version.outputs.label }}"
          cp -r build/linux/x64/release/bundle "$name"
          tar czf "$name.tar.gz" "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: gutter-linux-x64-*.tar.gz

  flatpak:
    needs: [version, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux
      - name: Unpack the Linux bundle
        run: |
          mkdir -p build/linux/x64/release/bundle
          tar xzf gutter-linux-x64-*.tar.gz --strip-components=1 \
            -C build/linux/x64/release/bundle
      - run: sudo apt-get update && sudo apt-get install -y flatpak flatpak-builder
      - name: Build
        run: |
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak-builder --user --install-deps-from=flathub \
            --disable-rofiles-fuse --force-clean --repo=repo \
            build/flatpak linux/flatpak/dev.gutter.gutter.yml
      - name: Bundle
        run: |
          # The runtime comes from Flathub when the bundle is installed.
          flatpak build-bundle \
            --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
            repo "gutter-linux-x64-${{ needs.version.outputs.label }}.flatpak" \
            dev.gutter.gutter
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: gutter-linux-x64-*.flatpak

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, linux, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Release notes: the tag's message (annotated tags; lightweight
          # ones have none) without any signature, then install notes.
          read -r obj_type obj_sha < <(gh api \
            "repos/$GH_REPO/git/ref/tags/$GITHUB_REF_NAME" \
            --jq '.object.type + " " + .object.sha')
          : > notes.md
          if [[ "$obj_type" == tag ]]; then
            gh api "repos/$GH_REPO/git/tags/$obj_sha" --jq .message \
              | sed -e '/^-----BEGIN PGP SIGNATURE-----/,$d' \
                    -e '/^-----BEGIN SSH SIGNATURE-----/,$d' > message.md
            if [[ -n "$(tr -d '[:space:]' < message.md)" ]]; then
              { cat message.md; printf '\n---\n\n'; } > notes.md
            fi
          fi
          cat >> notes.md <<'NOTES'
          **macOS** (`Gutter-macos-*.zip`): universal build for Apple Silicon and Intel, ad-hoc signed and not notarized.
          1. Unzip and move `Gutter.app` to `/Applications`.
          2. Clear the download quarantine flag (needed after every update):
             ```sh
             xattr -dr com.apple.quarantine /Applications/Gutter.app
             ```
             Or open Gutter once, then System Settings → Privacy & Security → **Open Anyway**.

          Or run `tool/install_macos.sh` from the repository, which downloads, installs and clears the flag.

          **Linux**, either:
          - Flatpak (`gutter-linux-x64-*.flatpak`): `flatpak install --user gutter-linux-x64-*.flatpak`, then `flatpak run dev.gutter.gutter` or open Gutter from your app menu. It runs your system's git.
          - Tarball (`gutter-linux-x64-*.tar.gz`): extract and run `./gutter`. Needs GTK 3.

          Requires `git` on the `PATH`.
          NOTES
          assets=(Gutter-macos-*.zip gutter-linux-x64-*.tar.gz gutter-linux-x64-*.flatpak)
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # Re-running a release: overwrite its assets, title and notes.
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            gh release edit "$GITHUB_REF_NAME" \
              --title "Gutter $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --title "Gutter $GITHUB_REF_NAME" --notes-file notes.md
          fi
